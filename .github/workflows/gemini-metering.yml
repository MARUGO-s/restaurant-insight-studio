name: Test Gemini metering

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mock-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: npm ci
      - run: python3 -B -m unittest discover -s scripts -p 'test_boj_usd_jpy.py'
      - run: npm run test:gemini-metering
