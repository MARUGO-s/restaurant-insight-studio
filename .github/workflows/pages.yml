name: Deploy Restaurant Insight Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:report
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ycsqfajidusuibqljjwr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xAOS8yDSozbiGYnEwejKwQ_SZ4MYMmB
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
